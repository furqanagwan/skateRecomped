[functions]
# Four copies of a pair of functions, as in the disc build. The first of each
# pair has blocks placed after the tail call that returns from it, branching
# back into its body; the second is a leaf whose last block sits after its blr
# and branches back the same way. Codegen ends both early, and stabilizing then
# loops between seeding the branch target and disabling that seed, so both
# halves need their bounds. The update moves this region 0x1C50 bytes up from
# the disc build's addresses; each end below is the next function's prologue in
# the dumped image.
"0x830265B8" = { end = 0x83026990 }
"0x83026990" = { end = 0x83026AE8 }
"0x8302ED58" = { end = 0x8302F130 }
"0x8302F130" = { end = 0x8302F288 }
"0x830316F8" = { end = 0x83031AD0 }
"0x83031AD0" = { end = 0x83031C28 }
"0x83036BF8" = { end = 0x83036FD0 }
"0x83036FD0" = { end = 0x83037128 }

# A switch whose cases each return: codegen ends the function at the first
# case's blr, leaving the later jump table targets outside it. The update moves
# this one 0x1BB0 bytes up from the disc build's address; its table is at
# 0x82BC3C88.
"0x82BC3C68" = { end = 0x82BC3DC8 }

# Starts right after the blr of the function before it, which codegen folds it
# into as unreachable code, so the gap scan sees a label and skips it. The
# update leaves this one where the disc build has it; it needs its bounds, not
# a bare seed, because its own loop branches back to its first block.
"0x82426668" = { end = 0x824266C4 }

